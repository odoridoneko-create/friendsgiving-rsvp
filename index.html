<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Annie &amp; John's Friendsgiving</title>
<meta name="description" content="Scan-to-RSVP potluck invite — mark yes/no, claim a dish, and see what's already covered." />
<meta property="og:title" content="Annie &amp; John's Friendsgiving" />
<meta property="og:description" content="RSVP and sign up to bring a dish for Friendsgiving, Nov 14." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%83%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700;900&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    color-scheme: light;
    --cream:            #F5EFE0;
    --cream-alt:        #F5EAD8;
    --tan:               #F0DEC0;
    --tan-deep:          #F0C89A;
    --white:             #FFFFFF;
    --ink:               #000000;
    --olive:             #5C6B3C;
    --moss:              #6B7F4A;
    --pumpkin:           #E8863C;
    --pumpkin-deep:      #D9691E;
    --gold:              #D98E4A;
    --rust:              #B5451D;
    --sienna:            #A0522D;
    --saddle:            #8B4513;
    --maroon:            #7A3B2E;

    --bg: var(--cream);
    --bg-stripe: var(--cream-alt);
    --surface: var(--white);
    --surface-tan: var(--tan);
    --text: var(--ink);
    --text-muted: var(--maroon);
    --border: color-mix(in srgb, var(--sienna) 35%, transparent);
    --border-strong: color-mix(in srgb, var(--saddle) 55%, transparent);

    --primary: var(--olive);
    --primary-hover: color-mix(in srgb, var(--olive) 82%, black);
    --primary-ink: var(--white);

    --accent: var(--pumpkin);
    --accent-hover: var(--pumpkin-deep);

    --danger: var(--rust);
    --danger-hover: color-mix(in srgb, var(--rust) 82%, black);

    --chip-main-bg: var(--saddle);
    --chip-main-ink: var(--cream);
    --chip-side-bg: var(--moss);
    --chip-side-ink: var(--cream);
    --chip-dessert-bg: var(--pumpkin);
    --chip-dessert-ink: #2A1B0E;
    --chip-drink-bg: var(--maroon);
    --chip-drink-ink: var(--cream);
    --chip-other-bg: var(--sienna);
    --chip-other-ink: var(--cream);

    --shadow: 0 1px 2px color-mix(in srgb, var(--saddle) 25%, transparent), 0 8px 24px color-mix(in srgb, var(--maroon) 18%, transparent);
    --font-display: 'Fraunces', Georgia, 'Iowan Old Style', serif;
    --font-body: 'Karla', 'Segoe UI', system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg: color-mix(in srgb, black 88%, var(--maroon) 12%);
      --bg-stripe: color-mix(in srgb, black 82%, var(--maroon) 18%);
      --surface: color-mix(in srgb, black 74%, var(--saddle) 26%);
      --surface-tan: color-mix(in srgb, black 62%, var(--gold) 38%);
      --text: var(--cream);
      --text-muted: color-mix(in srgb, var(--cream) 62%, var(--gold) 38%);
      --border: color-mix(in srgb, var(--cream) 22%, transparent);
      --border-strong: color-mix(in srgb, var(--cream) 38%, transparent);

      --primary: var(--moss);
      --primary-hover: color-mix(in srgb, var(--moss) 80%, white);
      --primary-ink: #0E140A;

      --accent: var(--pumpkin);
      --accent-hover: color-mix(in srgb, var(--pumpkin) 85%, white);

      --danger: color-mix(in srgb, var(--rust) 80%, white 20%);
      --danger-hover: color-mix(in srgb, var(--rust) 65%, white 35%);

      --chip-dessert-ink: #241505;
      --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg: color-mix(in srgb, black 88%, var(--maroon) 12%);
    --bg-stripe: color-mix(in srgb, black 82%, var(--maroon) 18%);
    --surface: color-mix(in srgb, black 74%, var(--saddle) 26%);
    --surface-tan: color-mix(in srgb, black 62%, var(--gold) 38%);
    --text: var(--cream);
    --text-muted: color-mix(in srgb, var(--cream) 62%, var(--gold) 38%);
    --border: color-mix(in srgb, var(--cream) 22%, transparent);
    --border-strong: color-mix(in srgb, var(--cream) 38%, transparent);

    --primary: var(--moss);
    --primary-hover: color-mix(in srgb, var(--moss) 80%, white);
    --primary-ink: #0E140A;

    --accent: var(--pumpkin);
    --accent-hover: color-mix(in srgb, var(--pumpkin) 85%, white);

    --danger: color-mix(in srgb, var(--rust) 80%, white 20%);
    --danger-hover: color-mix(in srgb, var(--rust) 65%, white 35%);

    --chip-dessert-ink: #241505;
    --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px rgba(0,0,0,.45);
  }

  *,*::before,*::after{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  h1,h2,h3{ font-family: var(--font-display); text-wrap: balance; margin: 0; color: var(--text); }
  p{ margin: 0; }
  button{ font-family: inherit; }
  input, select{ font-family: inherit; font-size: 1rem; }
  a{ color: inherit; }
  :focus-visible{ outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }

  .page{
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px 64px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .banner{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 24px 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .banner__motif{ color: var(--primary); opacity: .9; margin: 0 auto; }
  .banner__eyebrow{
    font-family: var(--font-body);
    font-weight: 700;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: .72rem;
    color: var(--accent-hover);
  }
  .banner h1{ font-size: clamp(1.7rem, 6vw, 2.3rem); font-weight: 700; }
  .banner__meta{
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: .92rem;
    color: var(--text-muted);
    font-weight: 500;
  }
  .banner__hosts{
    margin-top: 4px;
    font-size: .85rem;
    color: var(--text-muted);
  }
  .countdown-card{
    align-self: center;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 2px;
    padding: 12px 20px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--pumpkin) 0%, var(--gold) 55%, var(--pumpkin-deep) 100%);
    box-shadow: var(--shadow);
    color: var(--chip-dessert-ink);
  }
  .countdown-card__icon{
    flex-shrink: 0;
    display: flex;
    animation: leaf-bob 2.6s ease-in-out infinite;
  }
  @keyframes leaf-bob{
    0%, 100%{ transform: rotate(-6deg) translateY(0); }
    50%{ transform: rotate(6deg) translateY(-3px); }
  }
  .countdown-card__text{ display: flex; flex-direction: column; align-items: flex-start; gap: 0; }
  .countdown-card__num{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 2rem;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .countdown-card__label{
    font-size: .74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    opacity: .85;
  }
  .countdown-card--noNum .countdown-card__label{
    font-size: .95rem;
    text-transform: none;
    letter-spacing: 0;
  }
  .banner__actions{
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 6px;
  }
  .banner__actions a{ text-decoration: none; }

  .confetti-canvas{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 60;
  }

  .parking-widget{
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 45;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
  }
  .parking-fab{
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--primary);
    color: var(--primary-ink);
    border: none;
    box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .parking-fab:hover{ background: var(--primary-hover); }
  .parking-card{
    width: min(260px, 72vw);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 16px 14px;
    box-shadow: var(--shadow);
    animation: rise .25s ease both;
  }
  .parking-card__head{
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 8px;
  }
  .parking-card__title{
    display: flex; align-items: center; gap: 7px;
    font-weight: 700; font-size: .92rem;
  }
  .parking-card__title svg{ color: var(--accent-hover); }
  .parking-card p{ font-size: .86rem; color: var(--text); line-height: 1.45; }

  .card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 26px 22px;
    box-shadow: var(--shadow);
    animation: rise .35s ease both;
  }
  @keyframes rise{ from{ opacity:0; transform: translateY(8px);} to{opacity:1; transform:none;} }

  .stack{ display:flex; flex-direction:column; gap:16px; }
  .row{ display:flex; align-items:center; gap:10px; }
  .between{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

  .label{ font-weight: 700; font-size: .92rem; }
  .hint{ font-size: .84rem; color: var(--text-muted); }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field input[type="text"], .field input[type="password"], .field select{
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
  }
  .field input::placeholder{ color: var(--text-muted); opacity: .7; }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding: 13px 20px;
    border-radius: 999px;
    border: none;
    font-weight: 700;
    font-size: .95rem;
    cursor: pointer;
    transition: transform .12s ease, background .15s ease, opacity .15s ease;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{ background: var(--primary); color: var(--primary-ink); }
  .btn-primary:hover{ background: var(--primary-hover); }
  .btn-primary:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background: transparent; color: var(--primary); border: 1.5px solid var(--border-strong); }
  .btn-ghost:hover{ background: var(--bg-stripe); }
  .btn-block{ width: 100%; }
  .btn-sm{ padding: 8px 14px; font-size: .82rem; }
  .link{
    background:none; border:none; padding:0; cursor:pointer;
    font-weight:700; font-size:.85rem; color: var(--primary);
    display:inline-flex; align-items:center; gap:5px;
  }
  .link:hover{ text-decoration: underline; }

  .toggle-pair{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .toggle{
    padding: 16px 10px;
    border-radius: 16px;
    border: 2px solid var(--border-strong);
    background: var(--bg);
    color: var(--text);
    font-weight: 700;
    font-size: .98rem;
    cursor: pointer;
    text-align: center;
    transition: all .15s ease;
  }
  .toggle[aria-pressed="true"].toggle-yes{ background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
  .toggle[aria-pressed="true"].toggle-no{ background: var(--danger); border-color: var(--danger); color: var(--white); }

  .stepper{ display:flex; align-items:center; gap:14px; justify-content:center; }
  .stepper__btn{
    width: 42px; height: 42px; border-radius: 50%;
    border: 1.5px solid var(--border-strong);
    background: var(--bg);
    color: var(--primary);
    font-size: 1.2rem; font-weight: 700;
    cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  .stepper__btn:hover{ background: var(--bg-stripe); }
  .stepper__btn:disabled{ opacity: .35; cursor: not-allowed; }
  .stepper__val{
    font-family: var(--font-display); font-size: 1.6rem; font-weight: 700;
    min-width: 2.4ch; text-align:center; font-variant-numeric: tabular-nums;
  }

  .summary-banner{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background: var(--bg-stripe);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
  }
  .summary-banner__text{ font-size: .92rem; font-weight:600; }
  .summary-banner__text b{ font-family: var(--font-display); }

  .section-title{
    display:flex; align-items:center; gap:8px;
    font-family: var(--font-display);
    font-size: 1.15rem; font-weight: 700;
  }
  .section-title svg{ color: var(--accent-hover); flex-shrink:0; }

  .dietary-panel{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding: 16px 18px;
    border-radius: 16px;
    background: linear-gradient(135deg, color-mix(in srgb, var(--moss) 16%, var(--surface)) 0%, color-mix(in srgb, var(--pumpkin) 14%, var(--surface)) 100%);
    border: 1px solid var(--border);
  }
  .dietary-panel__title{
    display:flex; align-items:center; gap:8px;
    font-weight:700; font-size:.92rem;
  }
  .dietary-panel__title svg{ color: var(--accent-hover); flex-shrink:0; }
  .dietary-panel__tags{ display:flex; flex-wrap:wrap; gap:8px; }
  .dietary-tag{
    font-size:.82rem; font-weight:700;
    padding: 6px 13px;
    border-radius: 999px;
    background: var(--surface);
    border: 1.5px solid var(--border-strong);
  }

  .add-form{ display:flex; gap:8px; flex-wrap: wrap; }
  .add-form input[type="text"]{ flex: 1 1 160px; }
  .add-form select{ flex: 0 0 auto; }

  .list{ display:flex; flex-direction:column; gap:8px; margin-top: 10px; }
  .item{
    display:flex; align-items:center; gap:10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 12px;
  }
  .item__label{ flex:1; font-weight: 600; font-size: .94rem; }
  .item__by{ font-weight: 400; color: var(--text-muted); font-size: .84rem; }
  .item--covered{ opacity: .55; }
  .item--covered .item__label{ text-decoration: line-through; }
  .item--mine{ border-color: var(--border-strong); }
  .item--claimable{
    appearance: none;
    -webkit-appearance: none;
    font: inherit;
    text-align: left;
    width: 100%;
    cursor: pointer;
    transition: background .12s ease, transform .08s ease;
  }
  .item--claimable:hover{ background: var(--bg-stripe); border-color: var(--border-strong); }
  .item--claimable:active{ transform: scale(.98); }
  .item__claim{ color: var(--primary); display: flex; flex-shrink: 0; }

  .chip{
    font-size: .68rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
    padding: 4px 9px; border-radius: 999px; flex-shrink: 0;
  }
  .chip-main{ background: var(--chip-main-bg); color: var(--chip-main-ink); }
  .chip-side{ background: var(--chip-side-bg); color: var(--chip-side-ink); }
  .chip-dessert{ background: var(--chip-dessert-bg); color: var(--chip-dessert-ink); }
  .chip-drink{ background: var(--chip-drink-bg); color: var(--chip-drink-ink); }
  .chip-other{ background: var(--chip-other-bg); color: var(--chip-other-ink); }

  .icon-btn{
    width: 30px; height: 30px; border-radius: 50%;
    border: none; background: transparent; color: var(--text-muted);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
  }
  .icon-btn:hover{ background: var(--bg-stripe); color: var(--danger); }
  .icon-btn.edit:hover{ color: var(--primary); }

  .empty{ font-size: .88rem; color: var(--text-muted); font-style: italic; padding: 6px 2px; }

  .divider{ height:1px; background: var(--border); margin: 18px 0; border:none; }

  .toast{
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(8px);
    background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 999px; font-size: .86rem; font-weight: 600;
    box-shadow: var(--shadow);
    opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease;
    z-index: 50;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .footer-note{
    text-align:center; font-size: .78rem; color: var(--text-muted); padding-top: 8px;
  }

  .host-panel{
    margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--border-strong);
    display:flex; flex-direction:column; gap:10px;
  }
  .host-badge{
    font-size: .68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    color: var(--accent-hover);
  }

  .spinner{
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    animation: spin .8s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }
  .center-pad{ padding: 30px 0; text-align:center; }
</style>
</head>

  var CONFETTI_COLORS = ["#E8863C", "#5C6B3C", "#B5451D", "#D98E4A", "#6B7F4A", "#8B4513"];
  function confettiBurst(){
    if (REDUCED_MOTION) return;
    var canvas = document.getElementById("confettiCanvas");
    if (!canvas) return;
    var ctx = canvas.getContext("2d");
    var w = canvas.width = window.innerWidth;
    var h = canvas.height = window.innerHeight;
    var originX = w / 2;
    var pieces = [];
    for (var i = 0; i < 60; i++){
      pieces.push({
        x: originX + (Math.random() - 0.5) * 80,
        y: h * 0.28,
        vx: (Math.random() - 0.5) * 7,
        vy: -6 - Math.random() * 5,
        size: 5 + Math.random() * 5,
        color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 0.3
      });
    }
    var start = null;
    function frame(ts){
      if (!start) start = ts;
      var elapsed = ts - start;
      ctx.clearRect(0, 0, w, h);
      pieces.forEach(function(p){
        p.vy += 0.22;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vrot;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        ctx.restore();
      });
      if (elapsed < 1600){
        requestAnimationFrame(frame);
      } else {
        ctx.clearRect(0, 0, w, h);
      }
    }
    requestAnimationFrame(frame);
  }

  // Resolves once anonymous sign-in settles OR after `ms`, whichever comes
  // first — so a blocked/hanging auth request can never freeze the app.
  // Reads never depend on this (Firestore rules allow open reads); only
  // writes await it, and a write attempted before/without auth simply fails
  // with a clear error instead of hanging the whole page.
  function withTimeout(promise, ms){
    return new Promise(function(resolve){
      var done = false;
      var timer = setTimeout(function(){ if (!done){ done = true; resolve(); } }, ms);
      promise.then(function(){
        if (!done){ done = true; clearTimeout(timer); resolve(); }
      }).catch(function(err){
        console.error("Anonymous sign-in failed", err);
        if (!done){ done = true; clearTimeout(timer); resolve(); }
      });
    });
  }

    html += '<div class="section-title">Responses</div>';
    if (state.rsvps.length){
      var sorted = state.rsvps.slice().sort(function(a,b){ return (a.name || "").localeCompare(b.name || ""); });
      html += '<div class="list">';
      sorted.forEach(function(r){
        html += '<div class="item"><span class="item__label">' + esc(r.name) +
          (r.status === "yes"
            ? ' <span class="item__by">party of ' + r.headcount + '</span>'
            : ' <span class="item__by">can&rsquo;t make it</span>') +
          (r.status === "yes" && r.dietary ? '<br><span class="item__by">' + esc(r.dietary) + '</span>' : '') +
          '</span>' +
          '<button class="icon-btn" data-action="host-delete-rsvp" data-id="' + esc(r.id) + '" data-name="' + esc(r.name) + '" title="Remove RSVP">' + ICONS.trash + '</button>' +
          '</div>';
      });
      html += '</div>';
    } else {
      html += '<p class="empty">No responses yet.</p>';
    }

    html += '<hr class="divider" />';

    html += '<div class="section-title">' + ICONS.list + ' Dishes being brought</div>';
    if (state.items.length){
      html += '<div class="list">';
      state.items.forEach(function(i){
        html += '<div class="item">' +
          '<span class="chip chip-' + i.category + '">' + catMeta(i.category).label + '</span>' +
          '<span class="item__label">' + esc(i.label) + ' <span class="item__by">&mdash; ' + esc(i.bringerName) + '</span></span>' +
          '<button class="icon-btn" data-action="host-delete-item" data-id="' + esc(i.id) + '" data-label="' + esc(i.label) + '" title="Remove dish">' + ICONS.trash + '</button>' +
          '</div>';
      });
      html += '</div>';
    } else {
      html += '<p class="empty">Nobody&rsquo;s claimed a dish yet.</p>';
    }

    html += '<hr class="divider" />';

    html += '<div class="section-title">Needed items</div>';
    html += '<form id="neededForm" class="add-form">' +
      '<input type="text" id="neededLabel" placeholder="Add a needed item" required />' +
      '<select id="neededCategory">' + CATEGORIES.map(function(c){ return '<option value="' + c.id + '">' + c.label + '</option>'; }).join("") + '</select>' +
      '<button type="submit" class="btn btn-primary btn-sm">Add</button>' +
    '</form>';
    if (state.needed.length){
      html += '<div class="list">';
      state.needed.forEach(function(n){
        html += '<div class="item">' +
          '<span class="chip chip-' + n.category + '">' + catMeta(n.category).label + '</span>' +
          '<span class="item__label">' + esc(n.label) + '</span>' +
          '<button class="icon-btn" data-action="host-remove-needed" data-id="' + esc(n.id) + '" title="Remove">' + ICONS.trash + '</button>' +
          '</div>';
      });
      html += '</div>';
    } else {
      html += '<p class="empty">Nothing on the list.</p>';
    }

    html += '<hr class="divider" />';

    html += '<div class="section-title">Guest list</div>';
    html += '<p class="hint">Only names on this list can RSVP &mdash; keeps out typos and randoms. Add anyone invited: fill just the first field for a solo guest, or both for a couple (either partner can then RSVP for both). Use full names &mdash; if two guests share a first name, we need the last name to tell them apart.</p>';
    html += '<form id="householdForm" class="add-form">' +
      '<input type="text" id="hhMember1" placeholder="Guest name (full name)" required style="flex:1 1 120px;" />' +
      '<input type="text" id="hhMember2" placeholder="Partner (optional)" style="flex:1 1 120px;" />' +
      '<button type="submit" class="btn btn-primary btn-sm">Add</button>' +
    '</form>';
    if (state.households.length){
      html += '<div class="list">';
      state.households.slice().sort(function(a,b){ return (a.label||"").localeCompare(b.label||""); }).forEach(function(h){
        html += '<div class="item"><span class="item__label">' + esc(h.label) + '</span>' +
          '<button class="icon-btn" data-action="host-remove-household" data-id="' + esc(h.id) + '" title="Remove">' + ICONS.trash + '</button></div>';
      });
      html += '</div>';
    } else {
      html += '<p class="empty">Nobody added yet.</p>';
    }

    html += '<button class="link" data-action="host-exit" style="margin-top:6px;">Exit host mode</button>';
    html += '</div>';
    app.innerHTML = html;
  }

  function itemRow(i, showActions){
    var mine = i.bringerSlug === state.me.slug;
    var byLabel = mine ? "you" : i.bringerName;
    return '<div class="item ' + (mine ? "item--mine" : "") + '">' +
      '<span class="chip chip-' + i.category + '">' + catMeta(i.category).label + '</span>' +
      '<span class="item__label">' + esc(i.label) + ' <span class="item__by">&mdash; ' + esc(byLabel) + '</span></span>' +
      (showActions ?
        '<button class="icon-btn edit" data-action="edit-item" data-id="' + esc(i.id) + '" title="Edit">' + ICONS.pencil + '</button>' +
        '<button class="icon-btn" data-action="delete-item" data-id="' + esc(i.id) + '" title="Remove">' + ICONS.trash + '</button>'
        : '') +
      '</div>';
  }

  function isCovered(neededItem){
    var target = neededItem.label.trim().toLowerCase();
    return state.items.some(function(i){
      var lbl = i.label.trim().toLowerCase();
      return lbl === target || lbl.indexOf(target) !== -1 || target.indexOf(lbl) !== -1;
    });
  }

  // Pools every yes-RSVP's dietary note into a flat, de-duplicated,
  // anonymous list of restrictions — split on commas so "vegetarian, nut
  // allergy" becomes two separate tags. Who said what is never surfaced.
  function collectDietaryTags(){
    var seen = {};
    var tags = [];
    state.rsvps.forEach(function(r){
      if (r.status !== "yes" || !r.dietary) return;
      r.dietary.split(",").forEach(function(part){
        var t = part.trim();
        if (!t) return;
        var key = t.toLowerCase();
        if (seen[key]) return;
        seen[key] = true;
        tags.push(t);
      });
    });
    return tags;
  }

  function renderHostToggle(){
    var wrap = document.getElementById("hostToggleWrap");
    if (state.dbStatus !== "ready") { wrap.innerHTML = ""; return; }
    if (state.isHost){ wrap.innerHTML = ""; return; }
    if (state.showHostLogin){
      wrap.innerHTML =
        '<form id="hostForm" class="row" style="justify-content:center;">' +
          '<input type="password" id="hostPass" placeholder="Host passphrase" style="max-width:160px;padding:8px 10px;border-radius:10px;border:1.5px solid var(--border-strong);background:var(--bg);color:var(--text);" />' +
          '<button type="submit" class="btn btn-ghost btn-sm">Enter</button>' +
        '</form>' +
        (state.hostError ? '<div class="hint" style="color:var(--danger);margin-top:6px;">Not quite &mdash; try again.</div>' : '');
    } else {
      wrap.innerHTML = '<button class="link" data-action="show-host-login" style="margin:0 auto;">Hosting? Open the host console</button>';
    }
  }

  function renderParkingWidget(){
    var wrap = document.getElementById("parkingWidget");
    if (!wrap) return;
    if (state.dbStatus !== "ready" || state.screen !== "main" || state.isHost){
      wrap.innerHTML = "";
      return;
    }
    if (state.parkingOpen){
      wrap.innerHTML =
        '<div class="parking-card">' +
          '<div class="parking-card__head">' +
            '<div class="parking-card__title">' + ICONS.car + ' Parking heads-up</div>' +
            '<button class="icon-btn" data-action="parking-dismiss" title="Got it">' + ICONS.close + '</button>' +
          '</div>' +
          '<p>' + esc(PARKING_NOTE) + '</p>' +
        '</div>';
    } else {
      wrap.innerHTML = '<button class="parking-fab" data-action="parking-toggle" title="Parking info" aria-label="Parking info">' + ICONS.car + '</button>';
    }
  }

  function maybeShowParking(status){
    if (status !== "yes") return;
    var seen = false;
    try{ seen = !!localStorage.getItem("fg_parking_seen"); }catch(e){}
    if (seen) return;
    state.parkingOpen = true;
    try{ localStorage.setItem("fg_parking_seen", "1"); }catch(e){}
  }

  function renderAll(){
    render();
    renderHostToggle();
    renderParkingWidget();
  }

  // ---------- actions ----------

  function pickStatus(status){
    state.pendingStatus = status;
    if (status === "no") state.pendingHeadcount = 1;
    renderAll();
  }

  function changeHeadcount(delta){
    var cur = (state.rsvp && state.rsvp.status === "yes") ? state.rsvp.headcount : state.pendingHeadcount;
    var next = Math.max(1, Math.min(12, cur + delta));
    if (state.rsvp) state.rsvp.headcount = next;
    state.pendingHeadcount = next;
    renderAll();
  }

  function saveRsvp(){
    var status = state.pendingStatus || (state.rsvp && state.rsvp.status);
    if (!status) return;
    var headcount = status === "yes" ? (state.rsvp ? state.rsvp.headcount : state.pendingHeadcount) : 1;
    var dietary = (state.pendingDietary || "").trim();
    var payload = { name: state.me.name, status: status, headcount: headcount, dietary: dietary, updatedAt: nowIso() };
    authReady.then(function(){
      return setDoc(doc(state.db, "rsvps", state.me.slug), payload);
    }).then(function(){
      state.rsvp = payload;
      state.pendingStatus = null;
      state.screen = "main";
      toast("RSVP saved");
      maybeShowParking(status);
      renderAll();
    }).catch(function(err){
      console.error(err);
      writeFailToast(err);
    });
  }

  // The guest list IS the households collection — a household is 1 name
  // (solo guest) or 2 (a couple, either can RSVP for both). Matches on the
  // exact string OR just the first name, since guests often type only a
  // first name. Zero matches blocks the RSVP; more than one (a shared
  // first name) triggers the disambiguation screen.
  function findIdentityCandidates(name){
    var norm = name.trim().toLowerCase();
    var matches = [];
    state.households.forEach(function(h){
      if (!h.members || h.members.length < 1) return;
      h.members.forEach(function(m){
        var memberNorm = (m || "").trim().toLowerCase();
        var firstTok = memberNorm.split(/\s+/)[0];
        if (memberNorm === norm || firstTok === norm){
          matches.push({ household: h, member: m });
        }
      });
    });
    return matches;
  }

  // A 1-member household has no "just you or the whole household" choice
  // to make — it resolves straight through. A 2-member household still
  // asks.
  function enterHousehold(h, member){
    if (h.members.length > 1){
      state.householdMatch = { household: h, typedName: member };
      state.screen = "household-prompt";
      renderAll();
    } else {
      resolveIdentity(h.label, h.id, 1);
    }
  }

  function checkGuestListAndIdentify(name){
    name = (name || "").trim();
    if (!name) return;
    var matches = findIdentityCandidates(name);
    if (matches.length === 0){
      state.notOnListName = name;
      state.screen = "not-on-list";
      renderAll();
    } else if (matches.length === 1){
      enterHousehold(matches[0].household, matches[0].member);
    } else {
      state.ambiguousMatches = { typedName: name, matches: matches };
      state.screen = "disambiguate-prompt";
      renderAll();
    }
  }

  function handleDisambiguateChoice(btn){
    var h = state.households.filter(function(x){ return x.id === btn.getAttribute("data-household"); })[0];
    state.ambiguousMatches = null;
    if (!h) return;
    enterHousehold(h, btn.getAttribute("data-member"));
  }

  function handleHouseholdChoice(choice){
    var h = state.householdMatch.household;
    var typed = state.householdMatch.typedName;
    if (choice === "household"){
      resolveIdentity(h.label, h.id, h.members.length);
    } else {
      resolveIdentity(typed, slugify(typed), 1);
    }
    state.householdMatch = null;
  }

  function resolveIdentity(name, slug, defaultHeadcount){
    state.me = { name: name, slug: slug };
    saveIdentity();
    getDoc(doc(state.db, "rsvps", slug)).then(function(snap){
      if (snap.exists()){
        state.rsvp = snap.data();
        state.pendingHeadcount = state.rsvp.headcount || 1;
        state.pendingDietary = state.rsvp.dietary || "";
        state.screen = "main";
        maybeShowParking(state.rsvp.status);
      } else {
        state.rsvp = null;
        state.pendingStatus = null;
        state.pendingHeadcount = defaultHeadcount || 1;
        state.pendingDietary = "";
        state.screen = "rsvp";
      }
      renderAll();
    }).catch(function(err){
      console.error(err);
      toast("Couldn't reach the guest list — try again");
    });
  }

  function submitItem(label, categoryId){
    label = label.trim();
    if (!label) return;
    if (state.editingItemId){
      authReady.then(function(){
        return updateDoc(doc(state.db, "items", state.editingItemId), { label: label, category: categoryId });
      }).then(function(){
        state.editingItemId = null;
        state.editDraftLabel = "";
        toast("Updated");
        renderAll();
      }).catch(function(err){ console.error(err); writeFailToast(err); });
    } else {
      authReady.then(function(){
        return addDoc(collection(state.db, "items"), {
          label: label,
          category: categoryId,
          bringerSlug: state.me.slug,
          bringerName: state.me.name,
          createdAt: nowIso()
        });
      }).then(function(){
        toast("Dish locked in!");
        confettiBurst();
        renderAll();
      }).catch(function(err){ console.error(err); writeFailToast(err); });
    }
  }

  function deleteItem(id){
    authReady.then(function(){
      return deleteDoc(doc(state.db, "items", id));
    }).then(function(){
      toast("Removed");
    }).catch(function(err){ console.error(err); writeFailToast(err); });
  }

  function startEditItem(id){
    var i = state.items.filter(function(x){ return x.id === id; })[0];
    if (!i) return;
    state.editingItemId = id;
    state.editDraftLabel = i.label;
    state.editDraftCategory = i.category;
    renderAll();
    var el = document.getElementById("itemLabel");
    if (el) el.focus();
  }

  function cancelEdit(){
    state.editingItemId = null;
    state.editDraftLabel = "";
    renderAll();
  }

  // Pre-fills the "what are you bringing" form from a tapped Still Needed
  // row instead of re-rendering, so it doesn't disturb anything else on
  // screen — just fills, scrolls, and focuses for a fast one-tap claim.
  function claimNeededItem(label, categoryId){
    var labelInput = document.getElementById("itemLabel");
    var catSelect = document.getElementById("itemCategory");
    if (!labelInput || !catSelect) return;
    labelInput.value = label;
    catSelect.value = categoryId;
    labelInput.scrollIntoView({ behavior: REDUCED_MOTION ? "auto" : "smooth", block: "center" });
    labelInput.focus();
  }

  function hostAddNeeded(label, categoryId){
    label = label.trim();
    if (!label) return;
    authReady.then(function(){
      return setDoc(doc(state.db, "needed", slugify(label)), {
        label: label, category: categoryId, addedAt: nowIso()
      });
    }).then(function(){ toast("Added to needed list"); }).catch(function(err){ console.error(err); writeFailToast(err); });
  }

  function hostRemoveNeeded(id){
    authReady.then(function(){
      return deleteDoc(doc(state.db, "needed", id));
    }).then(function(){ toast("Removed"); }).catch(function(err){ console.error(err); writeFailToast(err); });
  }

  // A household is 1 or 2 full names: 1 for a solo guest, 2 for a couple
  // (either partner can then RSVP for both). This is the single, unified
  // guest list — there is no separate solo-guest collection.
  function hostAddHousehold(m1, m2){
    m1 = (m1 || "").trim();
    m2 = (m2 || "").trim();
    if (!m1) return;
    var members = m2 ? [m1, m2] : [m1];
    var label = m2 ? (m1 + " & " + m2) : m1;
    authReady.then(function(){
      return setDoc(doc(state.db, "households", slugify(label)), {
        members: members, label: label, addedAt: nowIso()
      });
    }).then(function(){ toast("Added to guest list"); }).catch(function(err){ console.error(err); writeFailToast(err); });
  }

  function hostRemoveHousehold(id){
    authReady.then(function(){
      return deleteDoc(doc(state.db, "households", id));
    }).then(function(){ toast("Removed"); }).catch(function(err){ console.error(err); writeFailToast(err); });
  }

  function hostDeleteRsvp(slug, name){
    if (!window.confirm("Remove " + name + "’s RSVP? This can’t be undone.")) return;
    authReady.then(function(){
      return deleteDoc(doc(state.db, "rsvps", slug));
    }).then(function(){ toast("RSVP removed"); }).catch(function(err){ console.error(err); writeFailToast(err); });
  }

  function hostDeleteItem(id, label){
    if (!window.confirm('Remove "' + label + '" from the list?')) return;
    authReady.then(function(){
      return deleteDoc(doc(state.db, "items", id));
    }).then(function(){ toast("Removed"); }).catch(function(err){ console.error(err); writeFailToast(err); });
  }

  function seedNeededIfEmpty(){
    getDocs(collection(state.db, "needed")).then(function(snap){
      if (!snap.empty) return;
      return authReady.then(function(){
        DEFAULT_NEEDED.forEach(function(n){
          setDoc(doc(state.db, "needed", slugify(n.label)), { label: n.label, category: n.category, addedAt: nowIso() }).catch(function(){});
        });
      });
    }).catch(function(err){ console.error(err); });
  }

  // ---------- events ----------

  document.addEventListener("input", function(e){
    if (e.target.id === "dietaryInput") state.pendingDietary = e.target.value;
  });

  document.addEventListener("submit", function(e){
    if (e.target.id === "nameForm"){
      e.preventDefault();
      checkGuestListAndIdentify(document.getElementById("nameInput").value);
    }
    if (e.target.id === "itemForm"){
      e.preventDefault();
      submitItem(document.getElementById("itemLabel").value, document.getElementById("itemCategory").value);
    }
    if (e.target.id === "neededForm"){
      e.preventDefault();
      hostAddNeeded(document.getElementById("neededLabel").value, document.getElementById("neededCategory").value);
      e.target.reset();
    }
    if (e.target.id === "householdForm"){
      e.preventDefault();
      hostAddHousehold(document.getElementById("hhMember1").value, document.getElementById("hhMember2").value);
      e.target.reset();
    }
    if (e.target.id === "hostForm"){
      e.preventDefault();
      var val = document.getElementById("hostPass").value;
      if (val === HOST_PASSPHRASE){
        state.isHost = true;
        state.showHostLogin = false;
        state.hostError = false;
        toast("Host mode on");
      } else {
        state.hostError = true;
      }
      renderAll();
    }
  });

  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if (!btn) return;
    var action = btn.getAttribute("data-action");
    if (action === "reload") location.reload();
    else if (action === "pick-status") pickStatus(btn.getAttribute("data-status"));
    else if (action === "headcount") changeHeadcount(parseInt(btn.getAttribute("data-delta"), 10));
    else if (action === "save-rsvp") saveRsvp();
    else if (action === "switch-guest"){ clearIdentity(); renderAll(); }
    else if (action === "edit-rsvp"){ state.pendingStatus = state.rsvp ? state.rsvp.status : null; state.screen = "rsvp"; renderAll(); }
    else if (action === "delete-item") deleteItem(btn.getAttribute("data-id"));
    else if (action === "edit-item") startEditItem(btn.getAttribute("data-id"));
    else if (action === "cancel-edit") cancelEdit();
    else if (action === "claim-needed") claimNeededItem(btn.getAttribute("data-label"), btn.getAttribute("data-category"));
    else if (action === "host-remove-needed") hostRemoveNeeded(btn.getAttribute("data-id"));
    else if (action === "host-remove-household") hostRemoveHousehold(btn.getAttribute("data-id"));
    else if (action === "host-delete-rsvp") hostDeleteRsvp(btn.getAttribute("data-id"), btn.getAttribute("data-name"));
    else if (action === "host-delete-item") hostDeleteItem(btn.getAttribute("data-id"), btn.getAttribute("data-label"));
    else if (action === "household-choice") handleHouseholdChoice(btn.getAttribute("data-choice"));
    else if (action === "disambiguate-choice") handleDisambiguateChoice(btn);
    else if (action === "retry-not-on-list") retryNotOnList();
    else if (action === "show-host-login"){ state.showHostLogin = true; renderHostToggle(); document.getElementById("hostPass").focus(); }
    else if (action === "host-exit"){ state.isHost = false; state.showHostLogin = false; renderAll(); }
    else if (action === "add-calendar") downloadCalendarInvite();
    else if (action === "parking-toggle"){ state.parkingOpen = true; renderParkingWidget(); }
    else if (action === "parking-dismiss"){ state.parkingOpen = false; renderParkingWidget(); }
  });

  // ---------- boot ----------

  function subscribe(){
    onSnapshot(query(collection(state.db, "items"), orderBy("createdAt", "asc")), function(snap){
      state.items = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){ console.error(err); });

    onSnapshot(collection(state.db, "needed"), function(snap){
      state.needed = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){ console.error(err); });

    onSnapshot(collection(state.db, "households"), function(snap){
      state.households = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){ console.error(err); });

    onSnapshot(collection(state.db, "rsvps"), function(snap){
      state.rsvps = snap.docs.map(function(d){ return Object.assign({ id: d.id }, d.data()); });
      render();
    }, function(err){ console.error(err); });
  }

  function boot(){
    renderAll();
    var app, auth;
    try{
      app = initializeApp(firebaseConfig);
      state.db = getFirestore(app);
      auth = getAuth(app);
    }catch(err){
      console.error(err);
      state.dbStatus = "unavailable";
      renderAll();
      return;
    }
    // Kick off anonymous sign-in in the background but don't block the UI
    // on it — reads work without it, and writes await `authReady` (which
    // resolves after 8s regardless, so a blocked/hanging request can never
    // freeze the page).
    authReady = withTimeout(signInAnonymously(auth), 8000);

    state.dbStatus = "ready";
    seedNeededIfEmpty();
    subscribe();
    if (loadIdentity()){
      resolveIdentity(state.me.name, state.me.slug, 1);
    } else {
      state.screen = "name";
      renderAll();
    }
  }

  boot();
})();
</script>
</body>
</html>
